<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" role="img" aria-labelledby="t d"><title id="t">Gebrüder Krafft – belegte Bereiche der Lederverarbeitung</title><desc id="d">Rotgerberei als historische Ausgangslage und zwei dokumentierte Produktgruppen Schuhwaren und Maschinenriemen. Die Linien stellen keinen nachgewiesenen innerbetrieblichen Produktionsweg dar.</desc><rect width="1100" height="450" fill="#f5f1e7"/><text x="55" y="65" fill="#283c32" font-family="Georgia,serif" font-size="32">Gebrüder Krafft · Leder und Produkte</text><text x="55" y="99" fill="#667269" font-family="Arial,sans-serif" font-size="17">Schematische Übersicht belegter Bereiche · keine Fabrikrekonstruktion</text><rect x="340" y="135" width="420" height="100" rx="7" fill="#2e473b"/><text x="550" y="176" fill="#fff" text-anchor="middle" font-family="Georgia,serif" font-size="27">Rotgerberei</text><text x="550" y="206" fill="#e7dcc2" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Wiederinbetriebnahme 1854</text><path d="M550 235 V278 M550 278 H270 V308 M550 278 H830 V308" fill="none" stroke="#b3955f" stroke-width="4"/><rect x="90" y="308" width="360" height="92" rx="6" fill="#fffdf8" stroke="#c6b89e" stroke-width="2"/><rect x="650" y="308" width="360" height="92" rx="6" fill="#fffdf8" stroke="#c6b89e" stroke-width="2"/><text x="270" y="346" text-anchor="middle" fill="#263b31" font-family="Georgia,serif" font-size="26">Schuhwaren</text><text x="270" y="375" text-anchor="middle" fill="#657168" font-family="Arial,sans-serif" font-size="16">belegter Produktbereich</text><text x="830" y="346" text-anchor="middle" fill="#263b31" font-family="Georgia,serif" font-size="26">Maschinenriemen</text><text x="830" y="375" text-anchor="middle" fill="#657168" font-family="Arial,sans-serif" font-size="16">in Produktübersicht 1929 genannt</text></svg>