<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">Power Sources and Mechanical Line-Shaft System</title><desc id="desc">Waterwheel and steam engine as alternative central power sources, both connected to line shafts, leather belts and working machines; later individual electric motors</desc><rect width="1120" height="380" rx="12" fill="#f5f0e6"/><g font-family="Georgia,serif" fill="#26372f"><text x="38" y="47" font-size="26">Power Sources and Line-Shaft System</text><text x="38" y="72" font-size="14" fill="#6c716a">Schematic comparison · not a reconstruction of any particular factory</text></g><g stroke="#a8a391" stroke-width="2" fill="none"><path d="M265 154 H350 V209 H425"/><path d="M265 276 H350 V209 H425"/><path d="M645 209 H720"/><path d="M920 209 H980"/></g><g fill="#a8a391"><path d="M418 203 l12 6 -12 6z"/><path d="M713 203 l12 6 -12 6z"/><path d="M973 203 l12 6 -12 6z"/></g><rect x="35" y="104" width="230" height="99" rx="9" fill="#dbe6df" stroke="#789889"/><rect x="35" y="226" width="230" height="99" rx="9" fill="#e9dfd1" stroke="#a08c72"/><rect x="430" y="157" width="215" height="104" rx="9" fill="#fdfbf7" stroke="#9d977f"/><rect x="725" y="157" width="195" height="104" rx="9" fill="#fdfbf7" stroke="#9d977f"/><rect x="980" y="157" width="105" height="104" rx="9" fill="#dbe6df" stroke="#789889"/><g font-family="Georgia,serif" fill="#26372f" text-anchor="middle"><text x="150" y="139" font-size="21">Waterwheel</text><text x="150" y="165" font-size="14">Water Power</text><text x="150" y="187" font-size="13">Central Power Source</text><text x="150" y="261" font-size="21">Steam Engine</text><text x="150" y="287" font-size="14">Steam Power</text><text x="150" y="309" font-size="13">Central Power Source</text><text x="537" y="193" font-size="20">Line-Shaft System</text><text x="537" y="218" font-size="15">Shafts and Pulleys</text><text x="537" y="239" font-size="13">Central Distribution</text><text x="822" y="193" font-size="20">Leather Belt</text><text x="822" y="218" font-size="15">Power Line-Shaft System</text><text x="822" y="239" font-size="13">To Working Machines</text><text x="1033" y="193" font-size="17">Machine</text><text x="1033" y="219" font-size="13">Work</text></g><g font-family="Arial,sans-serif" font-size="13" fill="#5d655d"><text x="37" y="355">Later, individual electric motors replaced centralised line-shaft systems in many places, but not everywhere at the same time.</text></g></svg>